services:
  mongo:
    image: mongo:7
    container_name: nocap-mongo
    ports:
      - '27017:27017'
    volumes:
      - nocap-mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nocap-mongo-data:
